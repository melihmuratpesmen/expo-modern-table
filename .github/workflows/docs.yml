name: Docs

# Builds the docs site (website/) with the web export of the example app at /demo/, and
# deploys it to GitHub Pages from main. Pull requests only build it, so broken links fail CI.
# One-time setup: Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'example/**'
      - 'src/**'
      - 'package.json'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'example/**'
      - 'src/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            example/package-lock.json
            website/package-lock.json
      - run: npm ci
        working-directory: example
      - run: npm ci
        working-directory: website
      - name: Export the demo app for the web
        run: npm run demo
        working-directory: website
      - name: Build the site (fails on broken internal links)
        run: npm run build
        working-directory: website
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: website/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
